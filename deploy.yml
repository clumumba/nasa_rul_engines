apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasa-rul-deployment
  labels:
    app: nasa_rul
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nasa_rul
  template:
    metadata:
      labels:
        app: nasa_rul
    spec:
      containers:
      - name: nasa
        image: clumumba62/nasa_rul:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: MODEL_PATH
          value: /app/artifacts/fd001_model.joblib
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
