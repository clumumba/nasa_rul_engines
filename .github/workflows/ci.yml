name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source compile
        run: |
          python -m compileall src

      - name: Run unit tests
        run: |
          pytest -q

      - name: Check DVC pipeline definition
        run: |
          dvc --version
          python - <<'PY'
          import yaml, pathlib
          path = pathlib.Path('dvc.yaml')
          with path.open() as fh:
              data = yaml.safe_load(fh)
          assert 'stages' in data, 'dvc.yaml missing stages'
          print('DVC pipeline definition is valid')
          PY

      - name: Reproduce DVC pipeline
        run: |
          dvc repro