name: Kubernetes deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker build"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify kubectl
        run: kubectl version --client

      - name: Use Docker Desktop context
        run: kubectl config use-context docker-desktop

      - name: Confirm cluster access
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Update deployment image
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: pwsh
        run: |
          $manifest = Get-Content -Path deploy.yml -Raw
          $image = "clumumba62/nasa_rul:$env:IMAGE_TAG"
          $updated = [regex]::Replace(
            $manifest,
            '(?m)^(\s*image:\s*)\S+(\s*)$',
            ('$1' + $image + '$2'),
            1
          )
          if ($updated -eq $manifest) {
            throw "No image entry found in deploy.yml"
          }
          Set-Content -Path deploy.yml -Value $updated -Encoding utf8
          Write-Host "Deploying $image"

      - name: Apply deployment and service
        run: |
          kubectl apply -f deploy.yml
          kubectl apply -f deploy_svc.yml
          kubectl rollout status deployment/nasa-rul-deployment --timeout=180s

      - name: Show service
        run: kubectl get svc nasa-rul-service