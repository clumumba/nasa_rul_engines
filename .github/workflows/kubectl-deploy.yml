name: Kubernetes deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify kubectl
        run: kubectl version --client

      - name: Use Docker Desktop context
        run: kubectl config use-context docker-desktop

      - name: Confirm cluster access
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Apply deployment and service
        run: |
          kubectl apply -f deploy.yml
          kubectl apply -f deploy_svc.yml
          kubectl rollout status deployment/nasa-rul-deployment --timeout=180s

      - name: Show service
        run: kubectl get svc nasa-rul-service