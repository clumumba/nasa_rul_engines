    - path: src
      hash: md5
      md5: 16f45f6d355769aee9234f54a662df57.dir
      size: 30042
      nfiles: 16
    params:
      params.yaml:
        dataset: FD001
        feature_window: 5
        max_rul: 130
        output_dir: artifacts
        random_state: 42
        test_size: 0.2
    outs:
