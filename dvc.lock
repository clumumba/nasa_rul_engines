schema: '2.0'
stages:
  ingest_data:
    cmd: python -c "from pathlib import Path; from src.data.load import COLUMNS,
      load_train; from src.data.validate import validate_dataframe; out_dir = 
      Path('data/processed'); out_dir.mkdir(parents=True, exist_ok=True); df = 
      load_train('FD001'); validate_dataframe(df, COLUMNS); df.to_csv(out_dir / 
      'fd001_train.csv', index=False)"
    deps:
    - path: configs/train_config.yaml
      hash: md5
      md5: f9c112e7b7c262e5b3fc3de78857c07e
      size: 106
    - path: data/raw
      hash: md5
      md5: 6cf8df1447dd528b8bab5da32eb6f32e.dir
      size: 44913306
      nfiles: 13
    - path: src
      hash: md5
      md5: c4b04a4b9b42c4317f0fdeb407a68edf.dir
      size: 63892
      nfiles: 47
    params:
      params.yaml:
        dataset: FD001
        feature_window: 5
        max_rul: 130
        output_dir: artifacts
        random_state: 42
        test_size: 0.2
    outs:
    - path: data/processed/fd001_train.csv
      hash: md5
      md5: 90fa65061a9dd7d01a10487d2ec97240
      size: 3416731
  train_model:
    cmd: python -m src.pipelines.train_pipeline --dataset FD001 --config 
      configs/train_config.yaml
    deps:
    - path: configs/train_config.yaml
      hash: md5
      md5: f9c112e7b7c262e5b3fc3de78857c07e
      size: 106
    - path: data/processed/fd001_train.csv
      hash: md5
      md5: 90fa65061a9dd7d01a10487d2ec97240
      size: 3416731
    - path: src
      hash: md5
      md5: c4b04a4b9b42c4317f0fdeb407a68edf.dir
      size: 63892
      nfiles: 47
    params:
      params.yaml:
        dataset: FD001
        feature_window: 5
        max_rul: 130
        output_dir: artifacts
        random_state: 42
        test_size: 0.2
    outs:
    - path: artifacts/fd001_metrics.json
      hash: md5
      md5: 367136d8f17c1e9a3050f4d87e784256
      size: 122
    - path: artifacts/fd001_model.joblib
      hash: md5
      md5: 5fc57509afd6236a7f3cf3bf6a07d4b4
      size: 2251688
  serve_model:
    cmd: "python -c \"from pathlib import Path; import json, yaml; model_path = Path('artifacts/fd001_model.joblib');
      assert model_path.exists(), 'Model artifact is missing'; config = yaml.safe_load(Path('configs/inference_config.yaml').read_text(encoding='utf-8'))
      or {}; manifest = {'service': 'fastapi', 'model_path': config.get('model_path',
      'artifacts/fd001_model.joblib'), 'host': config.get('host', '0.0.0.0'), 'port':
      config.get('port', 8000), 'health_check': '/health', 'prediction_endpoint':
      '/predict'}; Path('artifacts/serving_manifest.json').write_text(json.dumps(manifest,
      indent=2), encoding='utf-8')\""
    deps:
    - path: artifacts/fd001_model.joblib
      hash: md5
      md5: 5fc57509afd6236a7f3cf3bf6a07d4b4
      size: 2251688
    - path: configs/inference_config.yaml
      hash: md5
      md5: 26cbac81a4cddc98fe5f930a33126620
      size: 69
    - path: src
      hash: md5
      md5: c4b04a4b9b42c4317f0fdeb407a68edf.dir
      size: 63892
      nfiles: 47
    params:
      params.yaml:
        host: 0.0.0.0
        model_path: artifacts/fd001_model.joblib
        port: 8000
    outs:
    - path: artifacts/serving_manifest.json
      hash: md5
      md5: 4e22f0c15b9b6d300c436cd14449d0fb
      size: 184
